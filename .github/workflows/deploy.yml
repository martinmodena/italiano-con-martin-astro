name: Build Astro site and publish to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build site
        run: npm run build

      - name: Audit site inventory (dist)
        run: node scripts/audit-site.mjs --strict

      - name: Audit local links and assets (dist)
        run: node scripts/audit-links.mjs --strict

      - name: Audit vocabulary (dist)
        run: node scripts/audit-vocabulary.mjs

      - name: Audit grammar SEO (dist)
        run: node scripts/audit-grammar-seo.mjs

      - name: Upload static site files
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
