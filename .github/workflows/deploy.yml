name: Build Astro site and publish to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # Vuoto finché il segreto non esiste: allora i passi Cloudflare vengono saltati.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Versioni ridotte delle immagini già fatte (scripts/optimize-dist.mjs): la build crea solo le nuove.
      - name: Cache responsive images
        uses: actions/cache@v4
        with:
          path: .cache/responsive-images
          key: responsive-images-${{ hashFiles('scripts/optimize-dist.mjs') }}-${{ github.run_id }}
          restore-keys: responsive-images-${{ hashFiles('scripts/optimize-dist.mjs') }}-

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Audit language mix (source)
        run: node scripts/audit-language-mix.mjs --strict

      - name: Audit breadcrumbs (source)
        run: node scripts/add-breadcrumbs.mjs --check

      - name: Audit fable audio (source)
        run: node scripts/add-fable-audio.mjs --check

      - name: Audit story glossaries (source)
        run: node scripts/attach-glossary.mjs --check

      - name: Audit reading collection boxes (source)
        run: node scripts/add-reading-books.mjs --check

      - name: Build site
        run: npm run build

      - name: Audit site inventory (dist)
        run: node scripts/audit-site.mjs --strict

      - name: Audit local links and assets (dist)
        run: node scripts/audit-links.mjs --strict

      - name: Audit vocabulary (dist)
        run: node scripts/audit-vocabulary.mjs

      - name: Audit grammar SEO (dist)
        run: node scripts/audit-grammar-seo.mjs

      - name: Audit site size (dist, warning only)
        run: node scripts/audit-size.mjs

      - name: Upload static site files
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      # Copia di riserva su Cloudflare (vedi DECISIONI_SITO.md, 2026-11-22): il sito vero
      # è GitHub Pages; un errore qui non blocca la pubblicazione su GitHub.
      - name: Prepare dist for Cloudflare (301 redirects)
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        continue-on-error: true
        run: node scripts/cloudflare-redirects.mjs

      - name: Deploy to Cloudflare
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        continue-on-error: true
        env:
          CLOUDFLARE_ACCOUNT_ID: dfadfc59a5742cb8154b187ad7035d4f
        run: npx -y wrangler@4.164.0 deploy

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    # Avvisa Bing delle pagine cambiate (scripts/indexnow.mjs). Non blocca mai la pubblicazione.
    runs-on: ubuntu-latest
    needs: deploy
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 100

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Notify IndexNow
        # Il primo tentativo del 2026-10-29 ha avuto 403: la chiave non era ancora online.
        run: |
          for i in $(seq 1 20); do curl -fs https://italianoconmartin.com/56ed333318307916e33e31522f2f4313.txt >/dev/null && break; sleep 15; done
          sleep 60
          node scripts/indexnow.mjs --since "${{ github.event.before || 'HEAD~1' }}"
